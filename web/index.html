<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convert — Rust + egui, running in the browser</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #121212;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #dddddd;
        font: 16px system-ui, sans-serif;
        pointer-events: none;
      }
      footer {
        position: absolute;
        bottom: 8px;
        width: 100%;
        text-align: center;
        color: #666;
        font: 12px system-ui, sans-serif;
      }
      footer a {
        color: #888;
      }
    </style>
  </head>
  <body>
    <canvas id="convert_canvas"></canvas>
    <div id="loading">Loading…</div>
    <footer>
      Built with Rust + egui · <a href="https://github.com/not6741lol/unit-converter">source</a>
    </footer>

    <script type="module">
      import init, { WebHandle } from "./convert_web.js";

      async function run() {
        await init();
        const handle = new WebHandle();
        await handle.start(document.getElementById("convert_canvas"));
        document.getElementById("loading").remove();
      }

      run();
    </script>
  </body>
</html>
