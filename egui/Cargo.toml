[package]
name = "convert"
version = "0.2.0"
edition = "2024"
description = "Unit converter GUI built with egui/eframe."
license = "MIT"
repository = "https://github.com/not6741lol/unit-converter"

[dependencies]
convert-core = { path = "../core" }
# `glow` (OpenGL) instead of the default `wgpu` backend: much smaller binary.
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
